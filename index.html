<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarkX Projects — новая экосистема Minecraft</title>
  <meta name="description" content="DarkX Projects — новая экосистема Minecraft. DarkX Launcher и DarkX Visuals." />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --orange: #F97316;
      --orange-hover: #FB923C;
      --text: #FFFFFF;
      --muted: #525252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hub-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 32px 20px;
    }

    .hub-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      transform: translateY(-28px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 0 18px rgba(249, 115, 22, 0.25));
    }

    .brand-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: clamp(32px, 4.5vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      font-weight: 700;
      color: #FFFFFF;
      white-space: nowrap;
    }

    .brand-title span {
      font-weight: 300;
      color: #F5F5F5;
    }

    .brand-subtitle {
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 300;
      color: #E5E5E5;
      letter-spacing: 0.01em;
    }

    .hub-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .github-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.18s ease;
      text-decoration: none;
    }

    .github-btn img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      display: block;
    }

    .github-btn:hover {
      transform: scale(1.06);
      opacity: 0.92;
    }

    .launcher-pill {
      height: 54px;
      padding: 0 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, #F97316 0%, #EA580C 100%);
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.01em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 28px rgba(249, 115, 22, 0.32);
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s ease, background 0.18s ease;
    }

    .launcher-pill:hover {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #FB923C 0%, #F97316 100%);
      box-shadow: 0 12px 34px rgba(249, 115, 22, 0.48);
    }

    .hub-disclaimer {
      position: absolute;
      bottom: 16%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: clamp(16px, 1.8vw, 22px);
      line-height: 1.38;
      font-weight: 400;
      color: #525252;
      max-width: 540px;
      width: 90%;
    }

    @media (max-width: 560px) {
      .brand-row {
        flex-direction: column;
        text-align: center;
        gap: 14px;
      }
      .hub-disclaimer {
        bottom: 40px;
      }
    }
  </style>
</head>
<body>
  <main class="hub-page">
    <div class="hub-center">
      <div class="brand-row">
        <img src="assets/logo.png" alt="DarkX Logo" class="brand-logo" />
        <div class="brand-copy">
          <h1 class="brand-title">DarkX <span>Projects</span></h1>
          <p class="brand-subtitle">новая экосистема Minecraft</p>
        </div>
      </div>

      <div class="hub-actions">
        <a
          href="https://github.com/darkey-labs"
          target="_blank"
          rel="noopener noreferrer"
          class="github-btn"
          aria-label="GitHub DarkX Projects"
          title="GitHub — darkey-labs"
        >
          <img src="assets/github-logo.png" alt="GitHub" />
        </a>
        <a href="launcher.html" class="launcher-pill">Launcher</a>
      </div>
    </div>

    <p class="hub-disclaimer">
      *darkx и его продукты не связаны<br />
      с Mojang AB, или Microsoft.
    </p>
  </main>
</body>
</html>
